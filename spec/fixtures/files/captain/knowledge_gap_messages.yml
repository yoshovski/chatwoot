# 30 customer messages the AI could not answer, as a drone and farm equipment store sees them, and the groups they
# should end up in. The spec stubs the model with kind/question/topic/intent below; `rake captain:knowledge_gaps:eval`
# sends the same messages to the real fast model and compares.
generator_t50:
  kind: knowledge
  topic: Generator compatibility
  question: Can your generator power a DJI T50?
  messages:
    - I have a dji t50 and the generator I bought doesn't keep up, want to make sure the generator you are selling will
    - is the 12kw generator enough to charge t50 batteries continuously?
    - will your generator keep up with a DJI T50 in the field
