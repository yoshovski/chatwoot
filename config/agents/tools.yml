######  Captain Agent Tools Configuration #######
# id: Tool identifier used to resolve the class (Captain::Tools::{PascalCase(id)}Tool)
# title: Human-readable tool name for frontend display
# description: Brief description of what the tool does
# icon: Icon name for frontend display (frontend icon system)
# emoji: Emoji icon for tool chip and palette display
#######################################################

- id: add_contact_note
  title: 'Note on the contact'
  description: "Saves a note on the customer's profile"
  icon: 'note-add'
  emoji: '👤'

- id: add_private_note
  title: 'Add a private note'
  description: 'Leaves a note only your team can see'
  icon: 'eye-off'
  emoji: '📝'

- id: update_priority
  title: 'Set priority'
  description: "Changes the conversation's priority"
  icon: 'exclamation-triangle'
  emoji: '⚡'

- id: add_label_to_conversation
  title: 'Add a label'
  description: 'Tags the conversation'
  icon: 'tag'
  emoji: '🏷️'

- id: faq_lookup
  title: 'Search knowledge'
  description: 'Finds answers in your sources and FAQs'
  icon: 'search'
  emoji: '📚'

- id: resolve_conversation
  title: 'Resolve the chat'
  description: 'Marks the conversation as resolved'
  icon: 'checkmark'
  emoji: '✅'

- id: handoff
  title: 'Hand off to a person'
  description: 'Passes the chat to your team'
  icon: 'user-switch'
  emoji: '🙋'

- id: catalog_product_search
  title: 'Find products'
  description: 'Searches your catalog with live prices and links'
  icon: 'search'
  emoji: '🛍️'

- id: browse_catalog
  title: 'Browse categories'
  description: "Shows your store's collections"
  icon: 'tag'
  emoji: '🗂️'

- id: track_order
  title: 'Track an order'
  description: 'Checks order status with the order number and email'
  icon: 'checkmark'
  emoji: '📦'
