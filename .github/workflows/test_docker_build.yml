name: Test Docker Build

# Images are built only for version tags (publish_ee_docker.yml).
# Run this by hand when a Dockerfile change needs a trial build.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_REPO: ghcr.io/${{ github.repository }}

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          # Exercise the same shared dependency cache used by EE releases.
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-ee-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-ee-${{ env.PLATFORM_PAIR }},mode=max
