# #
# # This action will publish the knowledge service (services/ai) docker image.
# # Same triggers as publish_ee_docker.yml so every release tag ships both
# # ghcr.io/<repo> and ghcr.io/<repo>-knowledge with the same tag.
# # Lab and production are amd64 only.
# #

name: Publish knowledge service docker image

on:
  push:
    branches:
      - master
    tags:
      - v*
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  DOCKER_REPO: ghcr.io/${{ github.repository }}-knowledge

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Docker Tags
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "DOCKER_TAG=${DOCKER_REPO}:latest" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=${DOCKER_REPO}:${SANITIZED_REF}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/ai
          file: services/ai/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_TAG }}
          # Release tags cannot read GHA caches saved by previous tags.
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-amd64,mode=max

      - name: Inspect image
        run: docker buildx imagetools inspect "$DOCKER_TAG"
