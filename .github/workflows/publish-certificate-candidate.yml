name: Publish verified certificate images
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-certfix-20261028
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: knowledge
          context: services/ai
          dockerfile: services/ai/Dockerfile
          arguments: --require-certifi
          system_arguments: --require-pip
          system_python: /usr/local/bin/python
          image: chatwoot-knowledge
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Build the runtime image with fresh base layers
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        pull: true
        no-cache: true
        load: true
        push: false
        tags: local/certificate-trust:${{ matrix.name }}
        labels: 'org.opencontainers.image.revision=bda78e8ff34fd488f6eedeb17471d5a47fe117c9

          org.opencontainers.image.source=https://github.com/yoshovski/chatwoot'
    - name: Check application certificate stores and runtime
      run: "docker run --rm --read-only --network none --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint python \\\n  --volume\
        \ \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\" \\\n  local/certificate-trust:${{ matrix.name }} /check.py ${{ matrix.arguments\
        \ }}\n"
    - name: Check the base interpreter and bundled pip trust
      run: "docker run --rm --read-only --network none --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint ${{ matrix.system_python\
        \ }} \\\n  --volume \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\" \\\n  local/certificate-trust:${{ matrix.name }} /check.py\
        \ ${{ matrix.system_arguments }}\n"
    - name: Verify outbound HTTPS rejection with a valid control
      timeout-minutes: 4
      run: "docker run --rm --read-only --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint python \\\n  --volume \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\"\
        \ \\\n  local/certificate-trust:${{ matrix.name }} /check.py --online ${{ matrix.arguments }}\ndocker run --rm --read-only --cap-drop\
        \ ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint ${{ matrix.system_python }} \\\n  --volume \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\"\
        \ \\\n  local/certificate-trust:${{ matrix.name }} /check.py --online ${{ matrix.system_arguments }}\n"
    - name: Login to GHCR after trust checks pass
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish this exact tested image without changing latest
      env:
        CANDIDATE_IMAGE: ghcr.io/yoshovski/${{ matrix.image }}:certfix-20261028
        TESTED_IMAGE: local/certificate-trust:${{ matrix.name }}
      run: 'docker tag "$TESTED_IMAGE" "$CANDIDATE_IMAGE"

        docker push "$CANDIDATE_IMAGE"

        docker buildx imagetools inspect "$CANDIDATE_IMAGE"

        '
'on':
  push:
    branches:
    - ci/publish-certfix-20261028
